name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Check all contracts compile
        run: |
          cargo check --package asset_factory
          cargo check --package rwa-token  
          cargo check --package marketplace_escrow
      
      - name: Run all tests
        run: cargo test --workspace --verbose
      
      - name: Build WASM files
        run: |
          cargo build --package asset_factory --target wasm32-unknown-unknown --release
          cargo build --package rwa-token --target wasm32-unknown-unknown --release
          cargo build --package marketplace_escrow --target wasm32-unknown-unknown --release
      
      - name: Verify WASM outputs
        run: |
          ls -la target/wasm32-unknown-unknown/release/
          echo "✅ All contracts built successfully"