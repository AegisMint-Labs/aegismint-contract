name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Check and build all contracts
        run: |
          echo "🔍 Checking asset_factory..."
          cargo check --package asset_factory
          
          echo "🔍 Checking rwa-token..."
          cargo check --package rwa-token  
          
          echo "🔍 Checking marketplace_escrow..."
          cargo check --package marketplace_escrow
          
          echo "🏗️ Building WASM for asset_factory..."
          cargo build --package asset_factory --target wasm32-unknown-unknown --release
          
          echo "🏗️ Building WASM for rwa-token..."
          cargo build --package rwa-token --target wasm32-unknown-unknown --release
          
          echo "🏗️ Building WASM for marketplace_escrow..."
          cargo build --package marketplace_escrow --target wasm32-unknown-unknown --release
          
          echo "✅ All contracts compiled successfully!"
          ls -la target/wasm32-unknown-unknown/release/*.wasm