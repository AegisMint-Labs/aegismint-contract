name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.84
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.84.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Verify Rust version and add target
        run: |
          source ~/.cargo/env
          rustc --version
          rustup target add wasm32v1-none
          rustup component add rustfmt clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run tests
        run: |
          source ~/.cargo/env
          cargo test --verbose
      
      - name: Check formatting
        run: |
          source ~/.cargo/env
          cargo fmt -- --check
      
      - name: Run clippy
        run: |
          source ~/.cargo/env
          cargo clippy -- -D warnings

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.84
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.84.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Verify Rust version and add target
        run: |
          source ~/.cargo/env
          rustc --version
          rustup target add wasm32v1-none
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev pkg-config libudev-dev
      
      - name: Install Soroban CLI
        run: |
          source ~/.cargo/env
          cargo install soroban-cli
      
      - name: Build asset_factory
        run: |
          source ~/.cargo/env
          cargo build --package asset_factory --target wasm32v1-none --release
          soroban contract optimize \
            --wasm target/wasm32v1-none/release/asset_factory.wasm
      
      - name: Build rwa_token
        run: |
          source ~/.cargo/env
          cargo build --package rwa_token --target wasm32v1-none --release
          soroban contract optimize \
            --wasm target/wasm32v1-none/release/rwa_token.wasm
      
      - name: Build marketplace_escrow
        run: |
          source ~/.cargo/env
          cargo build --package marketplace_escrow --target wasm32v1-none --release
          soroban contract optimize \
            --wasm target/wasm32v1-none/release/marketplace_escrow.wasm
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32v1-none/release/*.optimized.wasm
